group = "ch.waio.pro_video_editor"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

// (module dependencies are declared after the android block further down)

// NOTE: dependencies are declared after the `android {}` block below so
// the Android Gradle plugin and Kotlin plugin are applied before dependency
// configurations are resolved. Test dependencies were removed from this
// module to avoid evaluation-time configuration errors in some Gradle setups.

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

// (module dependencies declared after android {} further below)

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "ch.waio.pro_video_editor"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

// Module dependencies (declared after plugin and android block)
dependencies {
    def media3_version = "1.9.0"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-transformer:$media3_version"
    implementation "androidx.media3:media3-effect:$media3_version"
    implementation "androidx.media3:media3-muxer:$media3_version"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
}
